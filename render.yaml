# Hiresy — Render Blueprint (monorepo)
# Connect this repo in Render: New > Blueprint > select JatayuS5-JustAgentic
# Or run: powershell -File scripts/render-deploy.ps1

envVarGroups:
  - name: hiresy-backend-shared
    envVars:
      - key: DATABASE_MODE
        value: aws
      - key: AWS_DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: S3_EVIDENCE_BUCKET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_VISION
        value: llama-3.2-90b-vision-preview
      - key: GROQ_MODEL_AUDIO
        value: whisper-large-v3
      - key: GITHUB_TOKEN
        sync: false
      - key: JAAS_APP_ID
        sync: false
      - key: LI_CLIENT_ID
        sync: false
      - key: LI_CLIENT_SECRET
        sync: false
      - key: LI_REDIRECT_URI
        sync: false
      - key: LI_SCOPE
        value: openid profile w_member_social
      - key: BREVO_API
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: rkdevzone@gmail.com
      - key: BREVO_SENDER_NAME
        value: Hiresy
      - key: QR_JWT_SECRET_KEY
        sync: false
      - key: SHORTLIST_MIN_SCORE
        value: "40"

services:
  - type: web
    name: hiresy-main-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: Backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - Backend/core/**
        - Backend/services/main_api/**
        - Backend/requirements.txt
        - Backend/Dockerfile
    envVars:
      - fromGroup: hiresy-backend-shared
      - key: FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_MAIN_API_URL
        fromService:
          name: hiresy-main-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MAIN_API_URL
        fromService:
          name: hiresy-main-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EVAL_API_URL
        fromService:
          name: hiresy-evaluator
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TEST_API_URL
        fromService:
          name: hiresy-shortlisting-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CODING_API_URL
        fromService:
          name: hiresy-coding-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LIVEHR_API_URL
        fromService:
          name: hiresy-live-hr
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: hiresy-evaluator
    runtime: docker
    plan: free
    region: oregon
    rootDir: Backend
    healthCheckPath: /health
    dockerCommand: sh -c "uvicorn services.evaluator.app:app --host 0.0.0.0 --port $PORT"
    buildFilter:
      paths:
        - Backend/core/**
        - Backend/services/evaluator/**
        - Backend/requirements.txt
        - Backend/Dockerfile
    envVars:
      - fromGroup: hiresy-backend-shared
      - key: FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: hiresy-shortlisting-test
    runtime: docker
    plan: free
    region: oregon
    rootDir: Backend
    healthCheckPath: /health
    dockerCommand: sh -c "uvicorn services.shortlisting_test.app:app --host 0.0.0.0 --port $PORT"
    buildFilter:
      paths:
        - Backend/core/**
        - Backend/services/shortlisting_test/**
        - Backend/requirements.txt
        - Backend/Dockerfile
    envVars:
      - fromGroup: hiresy-backend-shared
      - key: FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: hiresy-coding-test
    runtime: docker
    plan: free
    region: oregon
    rootDir: Backend
    healthCheckPath: /health
    dockerCommand: sh -c "uvicorn services.coding_test.app:app --host 0.0.0.0 --port $PORT"
    buildFilter:
      paths:
        - Backend/core/**
        - Backend/services/coding_test/**
        - Backend/requirements.txt
        - Backend/Dockerfile
    envVars:
      - fromGroup: hiresy-backend-shared
      - key: FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: hiresy-live-hr
    runtime: docker
    plan: free
    region: oregon
    rootDir: Backend
    healthCheckPath: /health
    dockerCommand: sh -c "uvicorn services.live_hr.app:app --host 0.0.0.0 --port $PORT"
    buildFilter:
      paths:
        - Backend/core/**
        - Backend/services/live_hr/**
        - Backend/requirements.txt
        - Backend/Dockerfile
    envVars:
      - fromGroup: hiresy-backend-shared
      - key: FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_FRONTEND_URL
        fromService:
          name: hiresy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: hiresy-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - Frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_MAIN_API_BASE
        fromService:
          name: hiresy-main-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_TEST_API_BASE
        fromService:
          name: hiresy-shortlisting-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CODING_API_BASE
        fromService:
          name: hiresy-coding-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_LIVEHR_API_BASE
        fromService:
          name: hiresy-live-hr
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_LIVEHR_WS_BASE
        sync: false
